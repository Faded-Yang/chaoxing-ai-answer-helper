name: 问题反馈
description: 答题不生效 / 答案错 / 面板不显示 等
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        反馈前请先确认：**用的是本仓库的版本**（版本号 `9.9.9`，header 里带 `@license MIT`），
        并且在脚本管理器里**关闭了该脚本的「检查更新」**（否则会被上游版本覆盖）。

  - type: input
    id: platform
    attributes:
      label: 平台与页面
      description: 例如：超星学习通 / 章节测试；知到智慧树 / 考试
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 脚本版本与脚本管理器
      description: 面板首页日志里那一行「AI 答题版已就绪」整句贴出来最省事
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: 模型
      options:
        - deepseek-flash
        - deepseek-v4-pro
        - 第三方中转（请在下文写模型名）
        - 其它

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 尽量具体：是没填答案、填错、卡住，还是面板没出来
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 面板「首页」里的日志行（**请删掉自己的 API Key / 卡密**）
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我确认没有把 API Key、题库卡密、学号等个人信息贴进来
          required: true
        - label: 我用的是本仓库版本，且已关闭脚本自动更新
          required: true
